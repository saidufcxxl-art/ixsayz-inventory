<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IXSAYZ Inventory">
  <title>IXSAYZ Inventory</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <section id="authScreen" class="auth-screen">
      <div class="brand-block">
        <div class="brand-mark">IX</div>
        <h1>IXSAYZ Inventory</h1>
        <p>Личное приложение без пароля: склад, поставки, штрихкоды, ценники, отчеты и экспорт.</p>
      </div>
      <div class="panel auth-form">
        <strong>Подключение к Firebase</strong>
        <p id="authMessage" class="setup-note">Проверяю настройки базы...</p>
      </div>
    </section>
    <section id="mainApp" class="main-app hidden">
      <header class="topbar">
        <div><span class="eyebrow">IXSAYZ</span><h2 id="viewTitle">Главная</h2></div>
        <button id="logoutBtn" class="text-btn" type="button">Обновить</button>
      </header>
      <main id="viewRoot" class="view-root"></main>
      <nav class="bottom-nav" aria-label="Основное меню">
        <button class="nav-btn active" type="button" data-view="dashboard">Главная</button>
        <button class="nav-btn" type="button" data-view="deliveries">Поставки</button>
        <button class="nav-btn" type="button" data-view="products">Товары</button>
        <button class="nav-btn" type="button" data-view="labels">Печать</button>
        <button class="nav-btn" type="button" data-view="reports">Отчеты</button>
      </nav>
    </section>
    <dialog id="modal" class="modal"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle"></h3><button id="modalClose" class="round-btn" type="button">x</button></div><div id="modalBody"></div></div></dialog>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
